[package]
name = "stashit"
version = "1.0.2"
description = "Легковесный плавающий карман (Drag-and-Drop Shelf) для Windows 10 & 11 на Rust и Tauri v2."
authors = ["kobaltgit"]
edition = "2021"

[lib]
name = "stashit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
drag = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Ole", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_SystemServices", "Win32_System_Memory", "implement"] }
windows-core = "0.58"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Threading"
] }
