name: 'Release Build'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'StashIt v__VERSION__'
          releaseBody: |
            ## 🚀 StashIt v__VERSION__

            ### 🇷🇺 Что нового в версии v__VERSION__:
            * **Мульти-полки и вкладки (Multi-Stash Tabs)**:
              - **Независимые полки**: разделяйте файлы по проектам и задачам в отдельных вкладках.
              - **Создание с Shift**: сброс файлов с зажатой клавишей `Shift` мгновенно создаёт новую полку с этими файлами.
              - **Постоянные и временные полки**: закрепляйте избранные полки (Pin 📌), чтобы они не закрывались после очистки и сохранялись между сессиями.
              - **Эргономичная навигация**: фиксированная справа кнопка `[+]`, переключение кликом, колёсиком мыши или шорткатами `Ctrl + 1..9` / `Ctrl + Tab`, создание `Ctrl + T`, закрытие `Ctrl + W`, переименование `F2` / двойной клик.
              - **Spring-Loaded Tabs при перетаскивании**: наведение файлов из Проводника на неактивную вкладку на 300 мс автоматически открывает её; прямой сброс на вкладку или `[+]` отправляет файлы по адресу.
            * **Комплексный автоматический тест-сьют**:
              - 41 юнит-тест, покрывающий Rust бэкенд (`cargo test`), Svelte 5 фронтенд (`vitest`) и Flutter Web сайт (`flutter test`).
            * **Автоматическая CI/CD сборка релизов**: генерация 3 вариантов дистрибутива:
              - **`StashIt___VERSION___x64-setup.exe`** — быстрый NSIS инсталлятор (без прав UAC)
              - **`StashIt___VERSION___x64_en-US.msi`** — Windows Installer package (MSI)
              - **`StashIt___VERSION___x64_portable.exe`** — автономная портативная версия

            ---

            ### 🇬🇧 What's New in v__VERSION__:
            * **Multi-Shelf Tabs (Multi-Stash)**:
              - **Multiple Shelves**: organize files across independent tabs for different projects or tasks.
              - **Instant Shift-Drop**: drop files while holding `Shift` to automatically create a new shelf.
              - **Pinned & Temporary Shelves**: pin favorite shelves (Pin 📌) to keep them persistent across sessions.
              - **Ergonomic Navigation**: pinned `[+]` button on the right, mouse wheel scrolling over tabs, `Ctrl + 1..9` / `Ctrl + Tab` switching, `Ctrl + T` new shelf, `Ctrl + W` close shelf, `F2` / double-click rename.
              - **Spring-Loaded Tabs**: hovering over inactive tabs while dragging files from Explorer opens them after 300 ms; direct drop onto tab header or `[+]` targets that shelf.
            * **Automated Test Suite**:
              - 41 unit tests covering Rust backend (`cargo test`), Svelte 5 frontend (`vitest`), and Flutter Web site (`flutter test`).
            * **Automated CI/CD Release Builds**:
              - **`StashIt___VERSION___x64-setup.exe`** — fast NSIS installer (no admin rights required)
              - **`StashIt___VERSION___x64_en-US.msi`** — Windows Installer package (MSI)
              - **`StashIt___VERSION___x64_portable.exe`** — standalone portable executable
          releaseDraft: false
          prerelease: false

      - name: Prepare and Upload Portable Executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${TAG_NAME#v}"
          if [ "$TAG_NAME" = "main" ] || [ -z "$TAG_NAME" ]; then
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${VERSION}"
          fi
          PORTABLE_NAME="StashIt_${VERSION}_x64_portable.exe"
          cp "src-tauri/target/release/stashit.exe" "${PORTABLE_NAME}"
          gh release upload "${TAG_NAME}" "${PORTABLE_NAME}" --clobber

      - name: Publish to WinGet
        if: startsWith(github.ref, 'refs/tags/v') && env.WINGET_TOKEN != ''
        uses: vedantmgoyal2009/winget-releaser@v2
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        with:
          identifier: kobaltgit.StashIt
          installers-regex: '.*-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}