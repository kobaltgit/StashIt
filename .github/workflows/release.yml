name: 'Release Build'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'StashIt v__VERSION__'
          releaseBody: |
            ## 🚀 StashIt v__VERSION__

            ### 🇷🇺 Что нового в версии v__VERSION__:
            * **Упрощённое управление окном и сворачивание в трей**:
              - Кнопка **`✕` (крестик)** в шапке теперь аккуратно скрывает окно кармана в трей (как клавиша `Esc`), не завершая фоновые службы и глобальные горячие клавиши.
              - Панель заголовка очищена от лишней кнопки «—» (минус) — лаконичный интерфейс без путаницы.
              - Полное завершение работы StashIt доступно через контекстное меню иконки в системном трее («Выход») или кнопку в настройках.
            * **Двусторонний обмен со смартфоном по Wi-Fi (Phone Drop)**:
              - **Мгновенное сопряжение по QR-коду**: кнопка телефона в шапке открывает нативный экран с QR-кодом для быстрого подключения смартфона без проводов и сторонних серверов.
              - **Передача со смартфона на ПК**: отправка фото, прямой снимок с камеры, передача документов, текста и ссылок сразу в карман.
              - **Скачивание и шеринг с ПК на смартфон**: удобный предпросмотр файлов кармана на экране телефона, скачивание и отправка через нативное меню шеринга.
              - **On-Demand микросервер на Rust**: работает только при открытом окне QR-кода и мгновенно выключается при скрытии кармана (0% CPU, строго <25 МБ ОЗУ).
            * **Автоматическая CI/CD сборка релизов**: генерация 3 вариантов дистрибутива:
              - **`StashIt___VERSION___x64-setup.exe`** — быстрый NSIS инсталлятор (без прав UAC)
              - **`StashIt___VERSION___x64_en-US.msi`** — Windows Installer package (MSI)
              - **`StashIt___VERSION___x64_portable.exe`** — автономная портативная версия

            ---

            ### 🇬🇧 What's New in v__VERSION__:
            * **Simplified Window Management & Tray Minimize**:
              - The **`✕` (close)** button in the header now smoothly hides the shelf to tray (identical to `Esc`), keeping shortcuts and background hooks active.
              - Removed the redundant «—» button from the header for a cleaner, modern look.
              - Clean application exit is always accessible via system tray context menu ("Exit") or Settings panel.
            * **Two-Way Wi-Fi Phone Drop (QR Code Pairing)**:
              - **Instant QR Pairing**: tap the phone icon in shelf header to pair instantly on local Wi-Fi with zero setup or cloud accounts.
              - **Phone to PC Upload**: upload photos, snap live camera shots, send files, documents, and notes straight to desktop shelf.
              - **PC to Phone Download & Share**: browse shelf items with live thumbnails, download files, or share via native Web Share API.
              - **On-Demand Rust Server**: micro-server spins up only when pairing is active and stops automatically when closed (0% idle CPU, <25 MB RAM).
            * **Automated CI/CD Release Builds**:
              - **`StashIt___VERSION___x64-setup.exe`** — fast NSIS installer (no admin rights required)
              - **`StashIt___VERSION___x64_en-US.msi`** — Windows Installer package (MSI)
              - **`StashIt___VERSION___x64_portable.exe`** — standalone portable executable
          releaseDraft: false
          prerelease: false

      - name: Prepare and Upload Portable Executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${TAG_NAME#v}"
          if [ "$TAG_NAME" = "main" ] || [ -z "$TAG_NAME" ]; then
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${VERSION}"
          fi
          PORTABLE_NAME="StashIt_${VERSION}_x64_portable.exe"
          cp "src-tauri/target/release/stashit.exe" "${PORTABLE_NAME}"
          gh release upload "${TAG_NAME}" "${PORTABLE_NAME}" --clobber